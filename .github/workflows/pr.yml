name: PR build check
on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
